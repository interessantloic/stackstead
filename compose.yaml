name: ${COMPOSE_PROJECT_NAME:-stackstead}

services:
  stackstead:
    image: ${STACKSTEAD_IMAGE:-ghcr.io/interessantloic/stackstead:0.1.1}
    pull_policy: ${STACKSTEAD_PULL_POLICY:-missing}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - name: web
        target: 8080
        published: "${STACKSTEAD_HTTP_PORT:-8080}"
        host_ip: ${STACKSTEAD_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
    environment:
      TZ: ${TZ:-UTC}
      STACKSTEAD_DATA_DIR: /data
      STACKSTEAD_HOST: 0.0.0.0
      STACKSTEAD_PORT: "8080"
      STACKSTEAD_POLL_SECONDS: ${STACKSTEAD_POLL_SECONDS:-5}
      STACKSTEAD_SAMPLE_SECONDS: ${STACKSTEAD_SAMPLE_SECONDS:-60}
      STACKSTEAD_SESSION_DAYS: ${STACKSTEAD_SESSION_DAYS:-30}
      STACKSTEAD_MAX_UPLOAD_BYTES: ${STACKSTEAD_MAX_UPLOAD_BYTES:-2097152}
      STACKSTEAD_SECURE_COOKIES: ${STACKSTEAD_SECURE_COOKIES:-0}
    volumes:
      - stackstead-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    restart: ${STACKSTEAD_RESTART_POLICY:-unless-stopped}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: ${STACKSTEAD_LOG_MAX_SIZE:-10m}
        max-file: "${STACKSTEAD_LOG_MAX_FILES:-3}"

volumes:
  stackstead-data:
    labels:
      org.opencontainers.image.title: Stackstead data
      org.opencontainers.image.description: Persistent SQLite database, encryption key and uploaded images
